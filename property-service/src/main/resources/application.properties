spring.application.name=property-service
spring.config.import=optional:configserver:http://config-server:8888
# Dynamic port binding
server.port=${SERVER_PORT:8082}

# MySQL Database
spring.datasource.url=jdbc:mysql://mysql-db:3306/propertydb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# RabbitMQ Configuration za Saga Pattern
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# RabbitMQ Exchange i Queue Config
app.rabbitmq.exchange=booking.events
app.rabbitmq.queue.property=property.service.queue
app.rabbitmq.queue.property-cancellations=property.cancellations.queue
app.rabbitmq.routing-key.reserved=booking.property.reserved
app.rabbitmq.routing-key.payment-failed=booking.payment.failed
app.rabbitmq.routing-key.compensation=booking.reservation.compensation
app.rabbitmq.routing-key.reservation-created=booking.reservation.created
app.rabbitmq.routing-key.reservation-cancelled=booking.reservation.cancelled

# Odgodjeni listener start (BUG-002: RabbitListenerStarter ce ih pokrenuti
# na ApplicationReadyEvent — nakon DataLoader-a, da izbjegne race condition)
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# Spring AMQP retry/requeue — poison messages se odbacuju nakon 3 pokusaja
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

# JWT — RSA javni kljuc (nasljedjen iz config-servera, app.jwt.public-key)
app.jwt.public-key=${APP_JWT_PUBLIC_KEY:}
