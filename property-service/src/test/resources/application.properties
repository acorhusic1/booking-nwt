spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.cloud.config.enabled=false
eureka.client.enabled=false
server.port=8082

# Provide RabbitMQConfig @Value placeholders so the bean still wires
app.rabbitmq.exchange=test.booking.events
app.rabbitmq.queue.property=test.property.queue
app.rabbitmq.queue.property-cancellations=test.property.cancellations.queue
app.rabbitmq.queue.reservation=test.reservation.queue
app.rabbitmq.routing-key.reserved=test.booking.property.reserved
app.rabbitmq.routing-key.payment-failed=test.booking.payment.failed
app.rabbitmq.routing-key.compensation=test.booking.reservation.compensation
app.rabbitmq.routing-key.reservation-created=test.booking.reservation.created
app.rabbitmq.routing-key.reservation-cancelled=test.booking.reservation.cancelled

# RabbitMQ - keep auto-config so RabbitTemplate bean exists, ali ne pokusavaj se
# povezati na broker (nema ga u test okruzenju)
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# RSA javni kljuc za verifikaciju JWT tokena u testovima
app.jwt.public-
