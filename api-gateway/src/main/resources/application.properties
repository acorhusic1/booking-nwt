spring.application.name=api-gateway

# Centralizovana konfiguracija (Config Server)
spring.config.import=optional:configserver:http://config-server:8888
spring.cloud.config.fail-fast=true

# Default port ako Config Server nije dostupan
server.port=8080

# Eureka Client
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# Discovery Configuration
spring.cloud.discovery.enabled=true
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Gateway rute za sve mikroservise
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**, /api/auth/**

spring.cloud.gateway.routes[1].id=property-service
spring.cloud.gateway.routes[1].uri=lb://property-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/properties/**,/api/amenities/**,/api/wishlists/**

spring.cloud.gateway.routes[2].id=reservation-service
spring.cloud.gateway.routes[2].uri=lb://reservation-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/reservations/**,/api/promo-codes/**,/api/cancellation-policies/**,/api/problem-reports/**

spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://payment-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payments/**,/api/wallets/**,/api/stripe/**

spring.cloud.gateway.routes[4].id=review-service
spring.cloud.gateway.routes[4].uri=lb://review-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/reviews/**

spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://notification-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notifications/**,/api/conversations/**

spring.cloud.gateway.routes[6].id=system-events-service
spring.cloud.gateway.routes[6].uri=lb://system-events-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/audit/**

spring.cloud.gateway.routes[7].id=analytics-service
spring.cloud.gateway.routes[7].uri=lb://analytics-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/reports/**,/api/statistics/**

# Aktivni profil
spring.profiles.active=dev
