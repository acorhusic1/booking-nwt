spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable cloud + service discovery in tests
spring.cloud.config.enabled=false
spring.config.import=
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# RSA javni kljuc za verifikaciju JWT tokena u testovima
app.jwt.public-

# RabbitMQ - keep auto-config so RabbitTemplate bean exists, but don't connect to broker
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
app.rabbit.auto-start-listeners=false

# RabbitMQ placeholders za @Value u RabbitMQConfig / Publisher / Listener
app.rabbitmq.exchange=test.booking.events
app.rabbitmq.queue.reservation=test.reservation.queue
app.rabbitmq.routing-key.reservation-created=test.booking.reservation.created
app.rabbitmq.routing-key.reservation-cancelled=test.booking.reservation.cancelled
app.rabbitmq.routing-key.property-reserved=test.booking.property.reserved
app.rabbitmq.routing-key.compensation=test.booking.reservation.compensation
app.rabbitmq.routing-key.payment-completed=test.booking.payment.completed
app.rabbitmq.routing-key.payment-failed=test.booking.payment.failed
