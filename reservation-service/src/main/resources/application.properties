spring.application.name=reservation-service
server.port=8083

# Centralizovana konfiguracija (Config Server) - opcioni import
spring.config.import=optional:configserver:http://config-server:8888

# MySQL Database
spring.datasource.url=jdbc:mysql://mysql-db:3306/reservationdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eureka klijent (service discovery)
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Actuator (healthchecks)
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# JWT (zajednicki sa user-service)
security.jwt.secret=${JWT_SECRET:bookingnwt-shared-jwt-secret-key-for-microservices-min-32-bytes}
