# Booking-NWT — orchestration za 7 microservisa, 2 infrastrukturna,
# MySQL, RabbitMQ i SPA frontend.
#
# Redoslijed (osigurana kroz depends_on + healthchecks):
#   1. mysql-db + rabbitmq (paralelno)         — infrastruktura
#   2. eureka-server                            — service discovery
#   3. config-server (čeka eureka)              — centralna konfiguracija
#   4. business servisi (čekaju config-server)  — paralelno
#   5. api-gateway (čeka business servise)      — javni ulaz
#   6. booking-app (čeka api-gateway)           — SPA frontend
#
# Memory budgets (mem_limit) cijenjeni tako da staju u ~5GB total —
# Java servisi koriste -XX:MaxRAMPercentage=75 (iz Dockerfile-a) pa
# garbage collector ima rezerve. Smanji ako ti pada na slabijoj masini.

services:

  # ═════════════════════════════════════════════════════════════════════
  # INFRASTRUKTURA
  # ═════════════════════════════════════════════════════════════════════

  mysql-db:
    image: mysql:8.0
    container_name: booking_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      # Smanji innodb buffer pool (default 128MB) — manje memory za dev
      MYSQL_INITDB_SKIP_TZINFO: "1"
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=200
      - --performance-schema=OFF
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    networks: [booking-net]

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    networks: [booking-net]

  # ═════════════════════════════════════════════════════════════════════
  # SLOJ 1 — Service Discovery
  # ═════════════════════════════════════════════════════════════════════

  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      # Eureka nema actuator — koristimo root path koji servisira dashboard HTML
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 384m
    networks: [booking-net]

  # ═════════════════════════════════════════════════════════════════════
  # SLOJ 2 — Centralna konfiguracija
  # ═════════════════════════════════════════════════════════════════════

  config-server:
    build:
      context: ./config-server
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8888/application/default || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 384m
    networks: [booking-net]

  # ═════════════════════════════════════════════════════════════════════
  # SLOJ 3 — Business mikroservisi
  # JWT ključeve cita iz config-server-a (config/application.properties)
  # pa ovdje ne ponavljamo APP_JWT_PUBLIC_KEY env-var.
  # ═════════════════════════════════════════════════════════════════════

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    networks: [booking-net]

  property-service-1:
    build:
      context: ./property-service
    container_name: property-service-1
    restart: unless-stopped
    environment:
      - SERVER_PORT=8082
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    networks: [booking-net]

  property-service-2:
    build:
      context: ./property-service
    container_name: property-service-2
    restart: unless-stopped
    environment:
      - SERVER_PORT=8085
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    networks: [booking-net]

  reservation-service:
    build:
      context: ./reservation-service
    container_name: reservation-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    networks: [booking-net]

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      # Stripe test mode — postavi pravi sk_test_... iz .env (vidi STRIPE_SETUP.md)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_PLACEHOLDER_REPLACE_ME}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-http://localhost:3000/dashboard?stripe_session={CHECKOUT_SESSION_ID}}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-http://localhost:3000/dashboard?stripe_cancelled=1}
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    networks: [booking-net]

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    networks: [booking-net]

  system-events-service:
    build:
      context: ./system-events-service
    container_name: system-events-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8087/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 384m
    networks: [booking-net]

  analytics-service:
    build:
      context: ./analytics-service
    container_name: analytics-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8088/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 384m
    networks: [booking-net]

  # ═════════════════════════════════════════════════════════════════════
  # SLOJ 4 — API Gateway (čeka business servise zbog Eureka routing-a)
  # ═════════════════════════════════════════════════════════════════════

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      property-service-1:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 384m
    networks: [booking-net]

  # ═════════════════════════════════════════════════════════════════════
  # SLOJ 5 — SPA frontend (čeka api-gateway)
  # ═════════════════════════════════════════════════════════════════════

  booking-app:
    build:
      context: ./booking-app
      args:
        # VITE varijabla mora biti dostupna u build time-u (inline-uje se u JS bundle).
        # Browser zove localhost:8080 (host machine), ne api-gateway:8080 (Docker DNS).
        VITE_API_URL: http://localhost:8080
    container_name: booking-app
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 128m
    networks: [booking-net]

# ─── Volumes ────────────────────────────────────────────────────────────
volumes:
  db_data:
  rabbitmq_data:

# ─── Networks ───────────────────────────────────────────────────────────
networks:
  booking-net:
    driver: bridge
