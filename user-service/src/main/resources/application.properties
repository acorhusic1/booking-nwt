spring.application.name=user-service

# Import configuration from Config Server
# Using 'config-server' hostname for Docker networking
spring.config.import=optional:configserver:http://config-server:8888

# Fail fast if config server is unreachable (to trigger retries)
spring.cloud.config.fail-fast=true
# Retry settings (requires spring-retry and spring-boot-starter-aop in pom.xml if we want full retry)
# For now, we'll keep it simple but the hostname fix is the priority.

# Default port in case config server is unreachable
server.port=8081

# Profile specific settings
spring.profiles.active=dev



