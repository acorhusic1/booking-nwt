spring.application.name=notification-service

# Centralizovana konfiguracija (Task 4 - Config Server)
spring.config.import=optional:configserver:http://config-server:8888

# Default port ako Config Server nije dostupan
server.port=8086

# Aktivni profil (dev/test profili podrzani kroz config-server)
spring.profiles.active=dev

# Eureka fallback - kad config-server kasni, servis ipak treba da zna gdje je Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# RabbitMQ — Saga notifikacije
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

app.rabbitmq.exchange=booking.events
app.rabbitmq.queue.notification=notification.service.queue
app.rabbitmq.routing-key.payment-completed=booking.payment.completed
app.rabbitmq.routing-key.payment-failed=booking.payment.failed
# F17 — prijava problema → notifikacija hostu
app.rabbitmq.routing-key.problem-reported=booking.problem.reported

# Odgodjeni listener start (BUG-002: RabbitListenerStarter ce ih pokrenuti
# na ApplicationReadyEvent — nakon DataLoader-a, da izbjegne race condition)
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
