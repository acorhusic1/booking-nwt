spring.application.name=notification-service
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
spring.cloud.openfeign.circuitbreaker.enabled=false

# RabbitMQ — auto-config ostaje (RabbitTemplate bean potreban), ali ne pokušavaj se
# povezati na broker u testovima (nema ga); placeholderi su test-only vrijednosti.
# Listener consumeri se ne startuju pa nema connection attempt-a.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
app.rabbit.auto-start-listeners=false

app.rabbitmq.exchange=test.booking.events
app.rabbitmq.queue.notification=test.notification.queue
app.rabbitmq.routing-key.payment-completed=test.booking.payment.completed
app.rabbitmq.routing-key.payment-failed=test.booking.payment.failed

# RSA javni kljuc za verifikaciju JWT tokena u testovima
app.jwt.public-
