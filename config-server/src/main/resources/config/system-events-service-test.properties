# System Events Service - TEST profile
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
# Disable external dependencies in tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
# JWT test — RSA javni kljuc (nasljedjen iz application.properties)
# Minimal logging in tests
logging.level.com.bookingnwt.systemevents=INFO
