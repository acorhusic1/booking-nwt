# Reservation Service Configuration (centralized)
server.port=8083

# MySQL Database
spring.datasource.url=jdbc:mysql://mysql-db:3306/reservationdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Actuator (expose circuit-breaker state)
management.endpoints.web.exposure.include=health,info,metrics,env,circuitbreakers
management.endpoint.health.show-details=always
management.health.diskspace.enabled=true
management.health.db.enabled=true
management.health.circuitbreakers.enabled=true

# JWT (must match user-service signing key — same property name, same value)
app.jwt.secret=very-long-secret-key-that-must-be-at-least-32-characters-long

# Feign timeouts (Task 5 - sync calls to property-service)
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
spring.cloud.openfeign.circuitbreaker.enabled=true

# Resilience4j (synchronous property-service availability check)
resilience4j.circuitbreaker.instances.property-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.property-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.property-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.property-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.property-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.property-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.property-service.automatic-transition-from-open-to-half-open-enabled=true
