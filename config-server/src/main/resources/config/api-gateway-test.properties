# API Gateway - TEST profile
# Disable external dependencies in tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.gateway.discovery.locator.enabled=false
# JWT test — RSA javni kljuc (nasljedjen iz application.properties)
# Minimal logging in tests
logging.level.org.springframework.cloud.gateway=WARN
logging.level.com.bookingnwt.apigateway=INFO
# Permissive rate limiting in tests
gateway.rate-limit.replenish-rate=1000
gateway.rate-limit.burst-capacity=2000
