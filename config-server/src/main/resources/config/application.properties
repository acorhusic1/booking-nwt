# Default konfiguracija za sve servise
spring.jpa.open-in-view=false

# Shared Security Configuration — RSA javni kljuc (verifikacija tokena)
# Privatni kljuc je iskljucivo u user-service konfiguraciji
app.jwt.public-
# 15 minutes access token
app.jwt.expiration=900000
# 7 days refresh token
app.jwt.refreshExpiration=604800000

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
