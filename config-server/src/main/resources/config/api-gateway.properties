# API Gateway Configuration (centralized)
server.port=8080

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Discovery locator (omogućava lb://<service-name>)
spring.cloud.discovery.enabled=true
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Globalni CORS (Task 7 - cross-cutting concern)
# Konkretni origin-i (ne *) jer browser sa Authorization headerom zahtjeva
# da Access-Control-Allow-Origin bude tacan, ne wildcard.
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=http://localhost:3000,http://localhost:5173,http://localhost:8080
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Sve rute idu kroz Eureka load balancer (lb://<service-id>)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**,/api/auth/**

spring.cloud.gateway.routes[1].id=property-service
spring.cloud.gateway.routes[1].uri=lb://property-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/properties/**,/api/amenities/**,/api/wishlists/**

spring.cloud.gateway.routes[2].id=reservation-service
spring.cloud.gateway.routes[2].uri=lb://reservation-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/reservations/**,/api/promo-codes/**,/api/cancellation-policies/**,/api/problem-reports/**

spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://payment-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payments/**,/api/wallets/**,/api/stripe/**

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=lb://notification-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**,/api/conversations/**,/api/messages/**

spring.cloud.gateway.routes[5].id=system-events-service
spring.cloud.gateway.routes[5].uri=lb://system-events-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/audit-logs/**

spring.cloud.gateway.routes[6].id=analytics-service
spring.cloud.gateway.routes[6].uri=lb://analytics-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/analytics/**,/api/statistics/**,/api/reports/**

# Actuator (healthchecks + gateway info)
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.access=read_only

# JWT — RSA javni kljuc za verifikaciju (privatni kljuc je samo u user-service)
# Nasljedjen iz application.properties (app.jwt.public-key)

# Putanje koje ne zahtjevaju JWT (registracija, login, swagger, actuator,
# javno pretrazivanje smjestaja).
# NAPOMENA: /api/properties/** je javno samo za GET — POST/PUT/PATCH/DELETE
# se i dalje validiraju u samom property-service-u kroz @PreAuthorize.
gateway.security.public-paths=/api/auth/**,/api/users/register,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/actuator/**,/api/properties/**,/api/amenities/**

# In-memory rate limiting (zahtjeva po sekundi po IP)
gateway.rate-limit.replenish-rate=20
gateway.rate-limit.burst-capacity=40
