# Notification Service Configuration (centralized)
server.port=8086

# MySQL Database
spring.datasource.url=jdbc:mysql://mysql-db:3306/notificationdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate JDBC batch (Task 4 - batch insert performance)
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Actuator (expose circuit-breaker health)
management.endpoints.web.exposure.include=health,info,metrics,env,circuitbreakers
management.endpoint.health.show-details=always
management.health.diskspace.enabled=true
management.health.db.enabled=true
management.health.circuitbreakers.enabled=true

# JWT — RSA javni kljuc (nasljedjen iz application.properties)

# Feign timeouts (Task 5 - sync calls to system-events-service)
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
spring.cloud.openfeign.circuitbreaker.enabled=true

# Resilience4j (synchronous system-events-service audit logging)
resilience4j.circuitbreaker.instances.system-events-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.system-events-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.system-events-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.system-events-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.system-events-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.system-events-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.system-events-service.automatic-transition-from-open-to-half-open-enabled=true
