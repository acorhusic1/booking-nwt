spring.application.name=system-events-service

# Centralizovana konfiguracija (Task 4 - Config Server)
spring.config.import=optional:configserver:http://config-server:8888

# Default port ako Config Server nije dostupan
server.port=8087

# Aktivni profil (dev/test profili podrzani kroz config-server)
spring.profiles.active=dev

# Eureka fallback - kad config-server kasni, servis ipak treba da zna gdje je Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
